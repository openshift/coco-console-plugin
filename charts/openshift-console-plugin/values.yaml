---
plugin:
  name: ""
  description: ""
  image: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  port: 9443
  securityContext:
    enabled: true
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
  ocpVersion: ""
  basePath: /
  nginx:
    # Honor the cluster-wide TLS security profile from
    # apiservers.config.openshift.io/cluster. The profile is resolved with Helm's
    # `lookup` at install/upgrade time and its minTLSVersion, ciphers (TLS 1.2
    # and below), TLS 1.3 cipher suites and groups (including ML-KEM hybrids for
    # PQC) are written to nginx.conf. Falls back to tlsProfile/ssl_* below when
    # the APIServer cannot be read (helm template, `--dry-run`, non-OpenShift).
    honorClusterTLSProfile: true
    # Explicit profile used when the cluster profile is unavailable, or when
    # honorClusterTLSProfile is false. type: Old | Intermediate | Modern | Custom.
    # Empty type = use the raw ssl_* values below.
    tlsProfile:
      type: ""
      custom:
        minTLSVersion: VersionTLS12
        ciphers: []
        groups: []
    # Fallback values (Intermediate profile, Mozilla Server Side TLS 5.8).
    # TLS 1.0/1.1 are disabled by OpenSSL 3, so the minimum is always TLS 1.2.
    ssl_protocols: "TLSv1.2 TLSv1.3"
    # TLS 1.2 and below. TLS 1.3 suites are set separately in ssl_ciphersuites.
    ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
    ssl_ciphersuites: "TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
    ssl_prefer_server_ciphers: "on"
    # Groups in API preference order. X25519MLKEM768 is the PQC (ML-KEM) hybrid
    # key exchange; the classical groups keep non-PQC clients working.
    ssl_ecdh_curve: "X25519MLKEM768:X25519:secp256r1:secp384r1"
    # Advertise h2 + http/1.1 over ALPN (the cluster profile does not set ALPN).
    http2: true
  networkPolicy:
    enabled: true
  certificateSecretName: ""
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  patcherServiceAccount:
    create: true
    annotations: {}
    name: ""
  jobs:
    patchConsoles:
      enabled: true
      image: "registry.redhat.io/openshift4/ose-tools-rhel9@sha256:e8fe921198df62fc130ac54f14254194763a2ef55d9f4592a22e06d51ec5d3f5"
      podSecurityContext:
        enabled: true
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
